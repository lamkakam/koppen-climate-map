name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Restore Koppen climate tile
        run: scripts/unpack_koppen_tile.sh

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Package dist
        run: |
          zip_name="koppen-climate-map-${GITHUB_REF_NAME}-dist.zip"
          cd dist
          zip -r "../${zip_name}" .

      - name: Create GitHub Release
        run: |
          zip_name="koppen-climate-map-${GITHUB_REF_NAME}-dist.zip"
          gh release create "${GITHUB_REF_NAME}" "${zip_name}" --title "${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
