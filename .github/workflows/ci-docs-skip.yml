name: Docs-only CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  docs-only:
    name: Full CI skipped
    runs-on: ubuntu-latest

    steps:
      - name: Skip full CI
        run: echo "Markdown-only change detected; full CI/CD workflow skipped."
